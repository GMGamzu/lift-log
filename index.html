<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0D0D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Layout: one calm phone column on soft grey; white rounded panels, black pills, big light numerals.
   Color is almost all neutral; status uses soft tints: green = progress / add weight, orange = stagnating, red = dipped. */
:root {
  --bg: #F2F2F0; --surface: #FFFFFF; --surface-2: #F2F2F0; --ink: #111111; --ink-2: #6E6E6B; --ink-3: #A6A6A2; --line: #E6E6E3;
  --accent: #111111; --accent-ink: #FFFFFF; --accent-soft: #EDEDEA;
  --hot: #EE6A24; --hot-ink: #FFFFFF; --hot-soft: #FDEBDF;
  --good: #1E7A4C; --good-soft: #E3F2E9; --warn: #B2581A; --warn-soft: #FBEBDC; --bad: #C2402E; --bad-soft: #F8E3DF;
  --f-display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --r: 24px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D0D0D; --surface: #1A1A1A; --surface-2: #242424; --ink: #F2F2F0; --ink-2: #A3A3A0; --ink-3: #6A6A67; --line: #2A2A2A;
  --accent: #F2F2F0; --accent-ink: #111111; --accent-soft: #262626;
  --hot: #F07A3A; --hot-ink: #111111; --hot-soft: #3A2215;
  --good: #5BC48D; --good-soft: #16291E; --warn: #EE9A5E; --warn-soft: #33241A; --bad: #EE7A68; --bad-soft: #35191A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D0D0D; --surface: #1A1A1A; --surface-2: #242424; --ink: #F2F2F0; --ink-2: #A3A3A0; --ink-3: #6A6A67; --line: #2A2A2A;
  --accent: #F2F2F0; --accent-ink: #111111; --accent-soft: #262626;
  --hot: #F07A3A; --hot-ink: #111111; --hot-soft: #3A2215;
  --good: #5BC48D; --good-soft: #16291E; --warn: #EE9A5E; --warn-soft: #33241A; --bad: #EE7A68; --bad-soft: #35191A; color-scheme: dark }

html, body { background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 var(--f-body); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
html { touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input, select { font: inherit; color: var(--ink); }
.num, input.big { font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; padding-inline: 18px; padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.08; font-weight: 600; letter-spacing: -.025em; }
h2 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.eyebrow { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.grow { flex: 1; min-width: 0; }
p { margin: 0; }

.top { padding-top: 18px; padding-bottom: 4px; display: grid; gap: 2px; }
.card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; min-width: 0; }
.banner { border-radius: 16px; padding: 10px 14px; font-size: 14px; background: var(--surface); color: var(--ink-2); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { background: var(--hot-soft); color: var(--ink); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 18px; font-weight: 500; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }

.chip { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: transparent; white-space: nowrap; }
.k-up { background: var(--good-soft); border-color: transparent; color: var(--good); }
.k-stall { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.k-dip { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.k-build, .k-push, .k-new { color: var(--ink-2); }

/* Start */
.start-main { text-align: left; border: 0; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 22px; display: grid; gap: 4px; }
.start-main .eyebrow { color: inherit; opacity: .6; }
.start-main .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.start-main .sub { font-size: 14px; opacity: .6; }
.slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.slot-btn { text-align: left; border: 0; background: var(--surface); border-radius: 20px; padding: 14px 16px; display: grid; gap: 2px; min-height: 64px; }
.slot-btn b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.slot-btn span { font-size: 13px; color: var(--ink-3); }

/* Workout */
.wk-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; margin-inline: -18px; padding-inline: 18px; display: grid; gap: 8px; }
.wk-head h1 { font-size: 26px; }
.wk-head input[type=date] { border: 0; background: transparent; color: var(--ink-3); padding: 0; font-size: 14px; }
.progress { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }

.ex { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.ex.open { box-shadow: 0 1px 0 var(--line), 0 12px 32px -18px rgb(0 0 0 / .25); }
.ex-h { width: 100%; border: 0; background: transparent; text-align: left; padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.ex-h .name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.ex-h .count { font-size: 15px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
.ex-h .count.full { color: var(--ink); }
.ex-h .last { grid-column: 1 / -1; font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ex-b { padding: 0 20px 20px; display: grid; gap: 14px; }
.rec { border-radius: 16px; padding: 12px 14px; font-size: 14px; display: grid; gap: 2px; background: var(--surface-2); color: var(--ink-2); }
.rec b { font-weight: 600; color: var(--ink); font-size: 15px; }
.rec.k-up { background: var(--good-soft); color: var(--ink-2); } .rec.k-up b { color: var(--good); }
.rec.k-stall { background: var(--warn-soft); color: var(--ink-2); } .rec.k-stall b { color: var(--warn); }
.rec.k-dip { background: var(--bad-soft); color: var(--ink-2); } .rec.k-dip b { color: var(--bad); }
.rec.k-build, .rec.k-push, .rec.k-new { background: var(--surface-2); color: var(--ink-2); }

.sets { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.set { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 12px; align-items: center; min-height: 48px; padding: 4px 4px; border-radius: 12px; font-variant-numeric: tabular-nums; }
.set .n { font-weight: 500; font-size: 14px; color: var(--ink-3); text-align: center; }
.set .val { white-space: nowrap; font-size: 21px; font-weight: 400; letter-spacing: -.02em; }
.set .val small { font-size: 13px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
.set .shadow { font-size: 14px; color: var(--ink-3); text-align: right; }
.set.done { cursor: pointer; }
.set.done:hover { background: var(--surface-2); }
.set.ghost .val { color: var(--ink-3); opacity: .6; }
.set.now { background: var(--surface-2); }
.set.now .n { color: var(--ink); }
.delta { font-size: 12px; font-weight: 600; min-width: 40px; text-align: center; padding: 3px 8px; border-radius: 999px; }
.delta.good { color: var(--good); background: var(--good-soft); }
.delta.same { color: var(--ink-2); background: var(--surface-2); }
.delta.bad { color: var(--bad); background: var(--bad-soft); }
.delta.none { background: transparent; }

.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 2px; }
.stepper button { border: 0; background: var(--surface-2); border-radius: 50%; width: 44px; height: 44px; font-size: 22px; line-height: 1; color: var(--ink); font-weight: 300; }
.stepper button:active { background: var(--line); }
.stepper label { display: grid; justify-items: center; align-content: center; min-width: 0; }
.stepper input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-size: 30px; font-weight: 300; letter-spacing: -.03em; padding: 0; }
.stepper small { font-size: 12px; color: var(--ink-3); margin-top: -2px; }
.entry .log { grid-column: 1 / -1; min-height: 54px; font-size: 16px; font-weight: 500; }
.edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edit-row .row { grid-column: 1 / -1; }

.sheet-back { position: fixed; inset: 0; background: rgb(0 0 0 / .3); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 80vh; border-radius: 28px 28px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-rows: auto auto 1fr; gap: 12px; }
.sheet input.search { width: 100%; border: 0; border-radius: 999px; padding: 13px 18px; background: var(--surface-2); font-size: 17px; }
.pick-list { overflow-y: auto; display: grid; gap: 2px; align-content: start; }
.pick-list button { text-align: left; border: 0; background: transparent; padding: 13px 10px; border-radius: 14px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
.pick-list button:hover { background: var(--surface-2); }
.pick-list button span { color: var(--ink-3); font-size: 14px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: grid; }
.stat b { font-size: 28px; font-weight: 300; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-3); }
.bw-in { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.field { border: 0; border-radius: 12px; background: var(--surface-2); padding: 10px 12px; font-size: 16px; width: 100%; min-width: 0; }

.hero-num { font-size: 56px; font-weight: 300; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }

.chart { position: relative; margin-inline: -4px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--ink); opacity: .04; }
.chart .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.chart .goal { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .goal-t { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }
.chart .xh { stroke: var(--line); stroke-width: 1; }
.chart .hl { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.35; padding: 7px 11px; border-radius: 12px; max-width: 220px; font-variant-numeric: tabular-nums; }
.chart-empty { padding: 24px 0; text-align: center; color: var(--ink-3); font-size: 14px; }

.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; min-height: 36px; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.list { display: grid; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); text-align: left; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.li:first-child { border-top: 0; padding-top: 4px; }
.li .t { font-weight: 500; font-size: 16px; letter-spacing: -.01em; }
.li .s { font-size: 14px; color: var(--ink-3); grid-column: 1; font-variant-numeric: tabular-nums; }
.li .r { grid-row: 1 / span 2; grid-column: 2; text-align: right; display: grid; justify-items: end; gap: 2px; }
.li .r b { font-weight: 400; font-size: 18px; letter-spacing: -.02em; }
.trend { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.trend.good { color: var(--good); } .trend.bad { color: var(--bad); } .trend.same { color: var(--ink-3); }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 500; padding: 6px 8px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:last-child, th:last-child { text-align: right; padding-right: 0; }

.hist-ex { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 15px; padding-block: 4px; }
.hist-ex span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }

.plan-ex { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; gap: 2px; align-items: center; min-height: 48px; border-top: 1px solid var(--line); }
.plan-ex:first-of-type { border-top: 0; }
.plan-ex .rng { display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--ink-3); }
.plan-ex .rng input { width: 38px; padding: 6px 2px; text-align: center; font-size: 14px; }
.icon-btn { border: 0; background: transparent; width: 38px; height: 38px; border-radius: 50%; color: var(--ink-3); font-size: 16px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:disabled { opacity: .25; }
.lib { display: grid; grid-template-columns: minmax(0, 1fr) 50px 50px 58px; gap: 6px; align-items: center; }
.lib .field { padding: 8px; font-size: 15px; }
.lib .hd { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.name-in { border: 0; background: transparent; font-size: 20px; font-weight: 600; letter-spacing: -.02em; padding: 0; width: 100%; min-width: 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 18px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
nav.tabs div { pointer-events: auto; max-width: 360px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 999px; padding: 6px; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .25); }
nav.tabs button { border: 0; background: transparent; padding: 8px 0; display: grid; justify-items: center; gap: 1px; font-size: 11px; font-weight: 500; color: var(--ink-3); min-height: 48px; border-radius: 999px; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current=page] { color: var(--bg); background: var(--ink); }
.save { font-size: 12px; color: var(--ink-3); }
.rest { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rest i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.rest b { font-weight: 600; color: var(--ink); }
.save.err { color: var(--bad); font-weight: 600; }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 12px; justify-items: center; }
.empty p { margin: 0; max-width: 34ch; color: var(--ink-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 30; max-width: calc(100% - 36px); }

/* Motion: quiet by default. Things settle into place rather than bounce; only the tab pill and a freshly logged set get a hint of spring.
   Everything below is skipped when the phone asks for reduced motion. */
nav.tabs div { position: relative; }
nav.tabs .pill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4); border-radius: 999px; background: var(--ink); transform: translateX(calc(var(--ti, 0) * 100%)); }
nav.tabs button { position: relative; z-index: 1; }
nav.tabs button[aria-current=page] { background: transparent; }
.chart .dot { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  :root { --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.36, .5, 1); }
  .btn, .slot-btn, .start-main, .li, .stepper button, .seg button, .icon-btn, .pick-list button, nav.tabs button, .ex {
    transition: transform .2s var(--ease), background-color .25s ease, color .25s ease, border-color .25s ease, box-shadow .3s ease, opacity .2s ease; }
  .btn:active:not(:disabled), .seg button:active, .icon-btn:active, .pick-list button:active { transform: scale(.96); }
  .slot-btn:active, .li:active { transform: scale(.98); }
  .start-main:active { transform: scale(.985); }
  .stepper button:active { transform: scale(.88); }
  .ex:has(> .ex-h:active) { transform: scale(.99); }
  nav.tabs button:active svg { transform: scale(.88); }
  nav.tabs button svg { transition: transform .2s var(--ease); }
  nav.tabs .pill { transition: transform .5s var(--spring); }
  .set.done { transition: background-color .2s ease; }
  .set.just { animation: glow 1.4s ease-out; }
  .set.just .val { animation: land .5s var(--spring) both; }
  .set.just .delta { animation: land .5s .12s var(--spring) both; }
  .set.just + .set.now { animation: fade .45s .18s var(--ease) both; }
  .ex.bump .count { display: inline-block; animation: tick .45s var(--spring); }
  .toast { animation: rise .32s var(--spring); }
  @keyframes glow { from { background: var(--surface-2); } }
  @keyframes land { from { opacity: 0; transform: translateY(8px) scale(.94); } }
  .rest i { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .2; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes tick { 40% { transform: translateY(-3px); color: var(--ink); } }
  @keyframes rise { from { transform: translate(-50%, 12px) scale(.96); opacity: 0; } }
}
</style>
</head>
<body>
<div id="app"><div class="top"><span class="eyebrow">Lift Log</span><h1>Loading your log</h1></div></div>
<div id="sheet"></div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>

<script>
(() => {
const $app = document.getElementById('app');
const $sheet = document.getElementById('sheet');
const $tabs = document.getElementById('tabs');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
const fw = w => String(Math.round(w * 100) / 100);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- progress ---------- */
function exSlots(exId) {

/* Strength index. A "lift" is one exercise on one day, so days stay apples to apples.

    const k = e.exId + '|' + (w.slotId || ''), m = logs[k] || (logs[k] = {}), n = wk(w.date);
    m[n] = Math.max(m[n] ?? -Infinity, Math.log(b));

  const weeks = [...new Set(done.map(w => wk(w.date)))].sort((x, y) => x - y);

  for (const k of keys) { const v = Object.values(logs[k]); a[k] = v.reduce((x, y) => x + y, 0) / v.length; }
  for (let it = 0; it < 60; it++) {
    for (const t of weeks) { let s = 0, n = 0; for (const k of keys) if (t in logs[k]) { s += logs[k][t] - a[k]; n++; } b[t] = n ? s / n : b[t]; }
    for (const k of keys) { let s = 0, n = 0; for (const t in logs[k]) { s += logs[k][t] - b[t]; n++; } a[k] = s / n; }

}

/* ---------- chart ---------- */
const charts = {};
function niceStep(span, n) { const raw = span / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
/* Monotone cubic path (Fritsch–Carlson): smooth like a hand-drawn line, but never overshoots the data. */
function smoothPath(P) {
  const n = P.length; if (n < 3) return P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = P[i + 1][0] - P[i][0]; m[i] = dx[i] ? (P[i + 1][1] - P[i][1]) / dx[i] : 0; }

  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = 'M' + P[0][0].toFixed(1) + ' ' + P[0][1].toFixed(1);
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(P[i][0] + h).toFixed(1)} ${(P[i][1] + t[i] * h).toFixed(1)} ${(P[i + 1][0] - h).toFixed(1)} ${(P[i + 1][1] - t[i + 1] * h).toFixed(1)} ${P[i + 1][0].toFixed(1)} ${P[i + 1][1].toFixed(1)}`;
  }
  return d;
}
function chart(id, pts, o = {}) {

  const W = Math.max(260, Math.min(500, ($app.clientWidth || 360) - 40)), H = o.h || 190, pL = 30, pR = 8, pT = 16, pB = 26;
  const ys = pts.map(p => p.y); if (o.goal != null) ys.push(o.goal);

  if (o.goal != null) g += `<line class="goal" x1="${pL}" x2="${W - pR}" y1="${y(o.goal)}" y2="${y(o.goal)}"/><text class="goal-t" x="${W - pR}" y="${y(o.goal) - 6}" text-anchor="end">${o.goalLabel || 'Goal'} ${fw(o.goal)}</text>`;
  const P = pts.map(p => [x(p.t), y(p.y)]);

  g += `<circle class="dot" cx="${P[P.length - 1][0]}" cy="${P[P.length - 1][1]}" r="5"/>`;
  g += `<line class="xh" y1="${pT}" y2="${H - pB}" visibility="hidden"/><circle class="hl" r="6" visibility="hidden"/>`;

function bindCharts() {

/* ---------- picker sheet ---------- */
function renderSheet() {
  const cur = $sheet.firstElementChild;

    if (!cur || cur.dataset.out) return;
    if (calm.matches || !cur.animate) { $sheet.innerHTML = ''; return; }
    cur.dataset.out = '1';
    cur.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: 'ease-in', fill: 'forwards' });
    cur.firstElementChild.animate([{ transform: 'none' }, { transform: 'translateY(105%)' }], { duration: 260, easing: 'cubic-bezier(.5, 0, .9, .4)', fill: 'forwards' })
      .onfinish = () => { if ($sheet.firstElementChild === cur) $sheet.innerHTML = ''; };
    return;
  }
  const fresh = !cur || !!cur.dataset.out;
  const title = S.picker.target === 'library' ? 'New exercise' : 'Add exercise';
  $sheet.innerHTML = `<div class="sheet-back" data-act="pickClose"><div class="sheet" role="dialog" aria-label="${title}"><div class="row spread"><h2>${title}</h2><button class="btn ghost sm" data-act="pickClose">Close</button></div><input class="search" id="pickq" placeholder="Search or type a new name" autocomplete="off" value="${esc(S.picker.q || '')}"><div class="pick-list" id="picklist"></div></div></div>`;

  const i = document.getElementById('pickq'); i.focus();
}
function paintPickList() {

  const w = active(), slot = S.picker.target === 'slot' ? slotById(S.picker.slot) : null;
  const used = new Set(S.picker.target === 'workout' && w ? w.entries.map(e => e.exId) : slot ? slot.items : []);
  const list = S.picker.target === 'library' ? [] : Object.values(S.exercises).filter(e => !used.has(e.id) && (!q || e.name.toLowerCase().includes(q))).sort((a, b) => a.name.localeCompare(b.name));

function csvText() {
  const q = v => { const t = String(v ?? ''); return (/[",]/.test(t) || t.includes(String.fromCharCode(10))) ? '"' + t.replace(/"/g, '""') + '"' : t; };

    /* the two rows swap places with a short slide */
    const a = $app.querySelector(`[data-k="${s.id}:${s.items[j]}"]`), b = $app.querySelector(`[data-k="${s.id}:${s.items[i]}"]`);
    if (a) anim(a, [{ transform: `translateY(${y0 - a.getBoundingClientRect().top}px)`, background: 'var(--surface-2)' }, { transform: 'none' }], { duration: 340 });
    if (b) anim(b, [{ transform: `translateY(${y1 - b.getBoundingClientRect().top}px)` }, { transform: 'none' }], { duration: 340 });
  },
  unslot: el => { const s = slotById(el.dataset.slot), i = +el.dataset.i; leave(el.closest('.plan-ex'), () => { s.items.splice(i, 1); saveSlot(s); render(); }); },
  dlBackup: () => dlSave('lift-log-backup-' + todayStr() + '.json', backupText()),
  dlCsv: () => dlSave('lift-log-' + todayStr() + '.csv', csvText()),
  exportCsv: () => {
    const q = v => { const t = String(v ?? ''); return (/[",]/.test(t) || t.includes(String.fromCharCode(10))) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const rows = [['date', 'day', 'exercise', 'set', 'weight_kg', 'reps', 'assisted']];
    for (const w of [...S.workouts].filter(w => w.done).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.startedAt || 0) - (b.startedAt || 0)))
      for (const e of w.entries || []) e.sets.forEach((st, i) => rows.push([w.date, w.slotName || '', exName(e.exId), i + 1, st.w, st.r, isAssisted(e.exId) ? 'yes' : '']));
    A.shareFile(rows.map(r => r.map(q).join(',')).join(String.fromCharCode(10)), 'lift-log-' + todayStr() + '.csv', 'text/csv', false);
  },
  shareFile: async (data, name, type, isBackup) => {
    const file = new File([data], name, { type });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
      if (isBackup) lsSet('liftlog.backupAt', String(Date.now()));
      toast((isBackup ? 'Backup ready: ' : 'Export ready: ') + name); render();
    } catch (e) { if (e && e.name !== 'AbortError') toast('Could not create the file.'); }
  },
  backup: async () => {
    const data = JSON.stringify({ app: 'lift-log', version: 1, savedAt: new Date().toISOString(), exercises: S.exercises, slots: S.slots, workouts: S.workouts }, null, 1);
    const name = 'lift-log-backup-' + todayStr() + '.json';
    return A.shareFile(data, name, 'application/json', true);
    const file = new File([data], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
      lsSet('liftlog.backupAt', String(Date.now())); toast('Backup ready: ' + name); render();
    } catch (e) { if (e && e.name !== 'AbortError') toast('Could not create the backup file.'); }
  },
  restoreYes: () => { const r = S.restore; S.restore = null; Object.assign(S, { exercises: r.exercises, slots: r.slots, workouts: r.workouts }); sortWorkouts(); saveLocal(); lsSet('liftlog.backupAt', String(Date.now())); S.draft = {}; toast('Restored ' + r.workouts.length + ' workouts'); render(); },
  restoreNo: () => { S.restore = null; render(); },
  demoOn: () => { if (S.mode === 'demo') return; S.real = { mode: S.mode, exercises: S.exercises, slots: S.slots, workouts: S.workouts, bw: S.bw, settings: S.settings }; Object.assign(S, makeDemo()); S.mode = 'demo'; S.tab = 'today'; S.summary = null; S.draft = {}; go(); render(); window.scrollTo(0, 0); },
  demoOff: () => { const r = S.real; S.real = null; Object.assign(S, { mode: r.mode, exercises: r.exercises, slots: r.slots, workouts: r.workouts, bw: r.bw, settings: r.settings }); sortWorkouts(); S.summary = null; S.draft = {}; S.progEx = null; go(); render(); },
};
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) f(el, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'pickq') { S.picker.q = t.value; paintPickList(); return; }
  if (t.dataset.field === 'dw' || t.dataset.field === 'dr') { const d = draftFor(t.dataset.ex, active()); d[t.dataset.field === 'dw' ? 'w' : 'r'] = t.value; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'pickq') { const first = document.querySelector('#picklist button'); first && first.click(); }
  if (ev.key === 'Escape' && S.picker) { S.picker = null; renderSheet(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'restore-file' && t.files && t.files[0]) {
    const file = t.files[0]; t.value = '';
    file.text().then(txt => { const d = JSON.parse(txt); if (!d || !d.exercises || !Array.isArray(d.workouts) || !Array.isArray(d.slots)) throw 0; S.restore = { ...d, name: file.name }; render(); })
      .catch(() => toast('That file is not a Lift Log backup.'));
    return;
  }
  const f = t.dataset.field; if (!f) return;
  if (f === 'wdate') { const w = active(); if (w && t.value) { w.date = t.value; S.draft = {}; saveWorkout(w); render(); } }
  else if (f === 'goal') { S.settings.goal = num(t.value); saveSettings(); }
  else if (f === 'slotMin' || f === 'slotMax') {
    const sl = slotById(t.dataset.slot), v = parseInt(t.value); if (!sl || !(v > 0)) return;
    sl.ranges = sl.ranges || {}; sl.ranges[t.dataset.ex] = { ...(sl.ranges[t.dataset.ex] || {}), [f === 'slotMin' ? 'repMin' : 'repMax']: v }; saveSlot(sl);
  }
  else if (f === 'slotName') { const s = slotById(t.dataset.slot); if (s && t.value.trim()) { s.name = t.value.trim(); saveSlot(s); } }
  else if (['exName', 'repMin', 'repMax', 'inc'].includes(f)) {
    const e = S.exercises[t.dataset.ex]; if (!e) return;
    if (f === 'exName') { if (!t.value.trim()) return; e.name = t.value.trim(); }
    else { const v = num(t.value); if (v == null || v <= 0) return; e[f] = f === 'inc' ? v : Math.round(v); }
    saveEx(e.id);
  }
});
window.addEventListener('resize', () => { if (Object.keys(charts).length && !document.activeElement?.matches('input')) render(); });

/* ---------- sample data (only shown when you ask for it; never saved) ---------- */
function makeDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ex = {}, mk = (name, repMin, repMax, inc) => { const id = 'd_' + name.toLowerCase().replace(/[^a-z]+/g, '_'); ex[id] = { id, name, repMin, repMax, inc }; return id; };
  const bench = mk('Bench Press', 6, 10, 2.5), incl = mk('Incline DB Press', 8, 12, 2), ohp = mk('Overhead Press', 6, 10, 2.5), lat = mk('Lateral Raise', 12, 15, 1), tri = mk('Triceps Pushdown', 10, 15, 2.5);
  const pull = mk('Weighted Pull-up', 6, 10, 2.5), row = mk('Barbell Row', 8, 12, 2.5), pd = mk('Lat Pulldown', 10, 12, 5), face = mk('Face Pull', 12, 15, 2.5), curl = mk('EZ Bar Curl', 8, 12, 2.5);
  const squat = mk('Back Squat', 5, 8, 2.5), rdl = mk('Romanian Deadlift', 8, 10, 5), lp = mk('Leg Press', 10, 15, 10), lc = mk('Leg Curl', 10, 15, 5), calf = mk('Calf Raise', 12, 15, 5);
  const slots = [
    { id: 'd_push', name: 'Push A', order: 0, items: [bench, incl, ohp, lat, tri] },
    { id: 'd_pull', name: 'Pull A', order: 1, items: [pull, row, pd, face, curl] },
    { id: 'd_legs', name: 'Legs', order: 2, items: [squat, rdl, lp, lc, calf] },
    { id: 'd_push_b', name: 'Push B', order: 3, items: [ohp, bench, lat, tri] },
  ];
  const start = { [bench]: 60, [incl]: 22, [ohp]: 40, [lat]: 8, [tri]: 25, [pull]: 0, [row]: 55, [pd]: 50, [face]: 20, [curl]: 25, [squat]: 80, [rdl]: 70, [lp]: 120, [lc]: 35, [calf]: 60 };
  const st = {};
  const workouts = []; const days = 70; let si = 0;
  for (let d = days; d >= 2; d -= (rnd() < 0.5 ? 1 : 2)) {
    const slot = slots[si++ % slots.length]; const date = new Date(); date.setDate(date.getDate() - d);
    const entries = slot.items.map((exId, k) => {
      const cfg = ex[exId], key = slot.id + exId;
      const s = st[key] || (st[key] = { w: slot.id === 'd_push_b' && exId === bench ? start[exId] - 7.5 : start[exId], reps: [cfg.repMin + 1, cfg.repMin, cfg.repMin] });
      const stuck = slot.id === 'd_push' && exId === ohp;
      if (stuck) s.reps = s.reps.map((r, i) => cfg.repMin + 1 - i + (rnd() < 0.4 ? 1 : 0) - (rnd() < 0.3 ? 1 : 0));
      else if (s.reps.filter(r => r >= cfg.repMax).length >= 2) { s.w += cfg.inc; s.reps = [cfg.repMin + 1, cfg.repMin, cfg.repMin]; }
      else s.reps = s.reps.map(r => Math.min(cfg.repMax, r + (rnd() < 0.55 ? 1 : 0)));
      return { exId, sets: s.reps.map(r => ({ w: s.w, r })) };
    });
    workouts.push({ id: 'dw' + d, date: dstr(date), startedAt: +date, finishedAt: +date, done: true, slotId: slot.id, slotName: slot.name, entries });
  }
  const bw = []; for (let d = 70; d >= 0; d -= 1) { if (rnd() < 0.35) continue; const date = new Date(); date.setDate(date.getDate() - d); bw.push({ date: dstr(date), kg: Math.round((68.2 + (70 - d) * 0.045 + (rnd() - 0.5) * 0.8) * 10) / 10 }); }
  workouts.sort((a, b) => a.date < b.date ? 1 : -1);
  return { exercises: ex, slots, workouts, bw, settings: { goal: 75, phase: 'bulk' } };
}

boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
